name: Scrape Jobs
on:
  schedule:
    - cron: '0 12 */3 * *' # Runs every 3 days at 12:00 UTC
  workflow_dispatch:       # Allows manual triggers from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm start
      - name: Commit updated jobs data
        run: |
          git config user.name "Job Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "chore: update job listings data"
          git push