name: Scrape Jobs & Deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every other day
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      custom_targets:
        description: 'JSON array of target domains from frontend'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run job scraper
        env:
          CUSTOM_TARGETS: ${{ inputs.custom_targets }}
        run: npm start

      - name: Commit updated jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          git diff --staged --quiet || git commit -m "chore: update scraped jobs"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4