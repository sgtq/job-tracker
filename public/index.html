<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Job Board Dashboard</title>
	<link rel="stylesheet" href="css/styles.css">
</head>

<body>
	<header class="app-header">
		<div class="header-left">
			<h1>Job Board</h1>
			<span id="last-updated-badge" class="timestamp-badge">Last Updated: Never</span>
		</div>
		<div class="header-right">
			<button id="sync-btn" class="btn-primary">↻ Sync Jobs</button>
			<button id="settings-toggle-btn" class="btn-secondary">⚙ Settings</button>
		</div>
	</header>

	<!-- Settings Panel / Drawer -->
	<div id="settings-panel" class="settings-panel hidden">
		<h2>GitHub Credentials</h2>
		<p class="settings-desc">Required to trigger cloud sync via GitHub Actions API.</p>
		<div class="form-group">
			<label for="gh-owner">GitHub Username / Owner</label>
			<input type="text" id="gh-owner" placeholder="e.g., username">
		</div>
		<div class="form-group">
			<label for="gh-repo">Repository Name</label>
			<input type="text" id="gh-repo" placeholder="e.g., job-scraper">
		</div>
		<div class="form-group">
			<label for="gh-token">Fine-grained Personal Access Token (PAT)</label>
			<input type="password" id="gh-token" placeholder="github_pat_...">
		</div>
		<div class="settings-actions">
			<button id="save-settings-btn" class="btn-primary">Save Credentials</button>
			<button id="close-settings-btn" class="btn-secondary">Close</button>
		</div>
	</div>

	<main class="main-content">
		<div id="global-error-container"></div>

		<!-- Filters Bar -->
		<section class="filters-bar">
			<input type="text" id="search-input" placeholder="Search title, company, or keyword...">

			<div class="filter-group">
				<select id="company-filter">
					<option value="">All Companies</option>
				</select>
				<select id="location-filter">
					<option value="">All Locations</option>
				</select>
			</div>

			<span id="job-count" class="job-count">0 jobs found</span>
		</section>

		<div id="job-list-container" class="job-grid">
			<!-- Job cards injected here -->
		</div>
	</main>

	<script type="module" src="js/app.js"></script>
</body>

</html>
